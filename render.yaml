# Render Blueprint — deploys the API and UI from this repo and auto-deploys on
# every push to the connected branch. Create it once via the Render dashboard:
# New → Blueprint → connect navarrokaloy1-tech/procreate → Apply. Then set the
# one required secret (the Supabase connection string) when prompted.
#
# Singapore is Render's closest region to the Supabase project (ap-south-1),
# which keeps API↔database latency down.

services:
  # ---- .NET API (Docker web service) ----
  - type: web
    name: procreate-api
    runtime: docker
    rootDir: procreate-api
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Supabase Postgres connection string — set in the dashboard (secret).
      # Accepts the postgres:// URI form from Supabase → Project Settings →
      # Database → Connection string.
      - key: ConnectionStrings__DefaultConnection
        sync: false
      # Signing key for the app's JWT — generated once and kept by Render.
      - key: Jwt__Key
        generateValue: true
      # The deployed UI's origin, for CORS. Matches the UI service name below.
      - key: Cors__AllowedOrigins
        value: https://procreate.onrender.com
      # Optional: SMTP app password for result/alert emails. Leave blank to skip.
      - key: Email__Password
        sync: false

  # ---- Angular UI (Node web service, so a UAT Basic Auth gate can sit in front) ----
  # A static site cannot password-protect itself, so the built app is served by
  # a tiny Node server (server.js) that optionally enforces HTTP Basic Auth.
  - type: web
    # The service name sets the public URL — "procreate" → procreate.onrender.com.
    # (rootDir stays procreate-ui; that's the repo folder, unrelated to the name.)
    name: procreate
    runtime: node
    rootDir: procreate-ui
    plan: free
    region: singapore
    autoDeploy: true
    buildCommand: npm ci && node scripts/set-api-base.mjs && npm run build
    startCommand: node server.js
    envVars:
      # The API's PUBLIC URL, baked into the production build. A fromService
      # `host` would give Render's internal name ("procreate-api"), which the
      # browser can't resolve — it needs the public onrender.com URL.
      - key: API_BASE
        value: https://procreate-api.onrender.com
      # UAT gate: set BOTH to turn on the browser password prompt; delete both
      # after UAT to serve the site with no gate (no redeploy type change).
      - key: UAT_USER
        sync: false
      - key: UAT_PASSWORD
        sync: false
