<header class="header">
  <div class="header__left" *ngIf="currentUser$ | async as user">
    <span class="header__welcome">Welcome</span>
    <div class="user-pill" [class.open]="menuOpen">
      <button type="button" class="user-pill__btn" (click)="toggleMenu()">
        <span class="user-pill__avatar">{{ user.fullName.charAt(0) }}</span>
        <span class="user-pill__name">{{ user.fullName }}</span>
        <span class="user-pill__caret"><app-icon name="chevron-down" [size]="16"></app-icon></span>
      </button>
      <div class="user-menu" *ngIf="menuOpen">
        <div class="user-menu__info">
          <strong>{{ user.fullName }}</strong>
          <small>{{ user.role }}</small>
        </div>
        <button type="button" class="user-menu__item" (click)="logout()">
          <app-icon name="logout" [size]="16"></app-icon>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </div>

  <div class="header__right">
    <button type="button" class="icon-btn" aria-label="Notifications">
      <app-icon name="bell" [size]="20"></app-icon>
      <span class="icon-btn__badge">1</span>
    </button>
    <button type="button" class="icon-btn" aria-label="Search">
      <app-icon name="search" [size]="20"></app-icon>
    </button>
    <button type="button" class="icon-btn" aria-label="Menu">
      <app-icon name="menu" [size]="20"></app-icon>
    </button>
  </div>
</header>
