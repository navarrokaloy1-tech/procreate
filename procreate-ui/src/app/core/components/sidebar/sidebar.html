<div class="sidebar">
  <div class="sidebar__brand">
    <span class="sidebar__mark">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 2 L8 14 H14 L4 30 L26 14 H18 L28 2 Z" fill="currentColor" />
      </svg>
    </span>
    <div class="sidebar__brand-text">
      <strong>Pro-Create</strong>
      <small>Fertility, OB-GYN &amp; Diagnostics</small>
    </div>
  </div>

  <nav class="sidebar__nav">
    <div class="nav-section" *ngFor="let section of sections">
      <p class="nav-section__label">{{ section.label }}</p>
      <a
        *ngFor="let item of section.items"
        [routerLink]="item.route"
        class="nav-link"
        [class.active]="isActive(item.route)"
      >
        <app-icon [name]="item.icon" [size]="18"></app-icon>
        <span>{{ item.label }}</span>
      </a>
    </div>
  </nav>

  <!--
    The waiting-room board. A plain anchor, not a routerLink: it opens on the
    second screen in its own tab and must not navigate the console away.
  -->
  <a
    class="sidebar__external"
    href="/queue-display"
    target="_blank"
    rel="noopener"
  >
    <app-icon name="monitor" [size]="18"></app-icon>
    <span>Queue Display</span>
    <app-icon class="sidebar__external-mark" name="external-link" [size]="14"></app-icon>
  </a>

  <div class="sidebar__footer">
    <p class="sidebar__footer-label">Logged in as:</p>
    <p class="sidebar__footer-user">{{ userName }}</p>
  </div>
</div>
