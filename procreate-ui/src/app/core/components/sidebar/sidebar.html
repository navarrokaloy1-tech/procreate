<div class="sidebar">
  <div class="sidebar__brand">
    <img
      class="sidebar__logo"
      src="assets/images/cropped-Pro-create-logo.webp"
      alt="Pro-Create Fertility and OB-GYN Clinic"
    />
  </div>

  <nav class="sidebar__nav">
    <div class="nav-section" *ngFor="let section of sections">
      <p class="nav-section__label">{{ section.label }}</p>
      <ng-container *ngFor="let item of section.items">
        <!-- Plain destination -->
        <a
          *ngIf="!item.children"
          [routerLink]="item.route"
          class="nav-link"
          [class.active]="isActive(item.route)"
        >
          <app-icon [name]="item.icon" [size]="18"></app-icon>
          <span>{{ item.label }}</span>
        </a>

        <!-- Expandable group (e.g. Appointments → Consultations / Procedures) -->
        <ng-container *ngIf="item.children">
          <button
            type="button"
            class="nav-link nav-link--parent"
            [class.active]="isActive(item.route)"
            [attr.aria-expanded]="isExpanded(item)"
            (click)="toggle(item)"
          >
            <app-icon [name]="item.icon" [size]="18"></app-icon>
            <span>{{ item.label }}</span>
            <app-icon
              class="nav-link__caret"
              [name]="isExpanded(item) ? 'chevron-down' : 'chevron-right'"
              [size]="15"
            ></app-icon>
          </button>
          <div class="nav-subnav" *ngIf="isExpanded(item)">
            <a
              *ngFor="let child of item.children"
              [routerLink]="child.route"
              class="nav-link nav-link--child"
              [class.active]="isActive(child.route)"
            >
              <app-icon [name]="child.icon" [size]="16"></app-icon>
              <span>{{ child.label }}</span>
            </a>
          </div>
        </ng-container>
      </ng-container>
    </div>
  </nav>

  <!--
    The waiting-room board. A plain anchor, not a routerLink: it opens on the
    second screen in its own tab and must not navigate the console away.
  -->
  <a
    class="sidebar__external"
    href="/queue-display"
    target="_blank"
    rel="noopener"
  >
    <app-icon name="monitor" [size]="18"></app-icon>
    <span>Queue Display</span>
    <app-icon class="sidebar__external-mark" name="external-link" [size]="14"></app-icon>
  </a>

  <div class="sidebar__footer">
    <p class="sidebar__footer-label">Logged in as:</p>
    <p class="sidebar__footer-user">{{ userName }}</p>
  </div>
</div>
