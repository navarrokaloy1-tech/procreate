<div class="signin">
  <!-- Clinic photograph. Decorative, so it carries no alt text. -->
  <div
    class="signin__art"
    style="background-image: url('assets/images/imageProCreate.png')"
    role="presentation"
  ></div>

  <div class="signin__panel">
    <div class="signin__inner">
      <header class="signin__brand">
        <img
          class="signin__logo"
          src="assets/images/cropped-Pro-create-logo.webp"
          alt="Pro-Create Fertility and OB-GYN Clinic"
        />
      </header>

      <p class="signin__audience">Administrator</p>

      <!-- Method choice -->
      <ng-container *ngIf="mode === 'choose'">
        <button type="button" class="signin__method" (click)="openScanner()">
          <app-icon name="qr" [size]="22"></app-icon>
          Log in with QR
        </button>

        <button type="button" class="signin__method" (click)="choosePassword()">
          <app-icon name="key" [size]="22"></app-icon>
          Log in with password
        </button>
      </ng-container>

      <!-- Password sign-in -->
      <form
        class="signin__form"
        *ngIf="mode === 'password'"
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()"
      >
        <h2 class="signin__heading">Log in with password</h2>

        <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

        <div class="form-group">
          <label class="signin__label" for="username">Username</label>
          <input
            id="username"
            type="text"
            class="signin__input"
            formControlName="username"
            placeholder="Please enter your username"
            autocomplete="username"
          />
          <small
            class="invalid-feedback"
            *ngIf="usernameControl?.touched && usernameControl?.invalid"
          >
            Enter your username.
          </small>
        </div>

        <div class="form-group">
          <label class="signin__label" for="password">Password</label>
          <span class="signin__reveal-wrap">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              class="signin__input"
              formControlName="password"
              placeholder="Please enter your password"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="signin__reveal"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <app-icon name="eye" [size]="18"></app-icon>
            </button>
          </span>
          <small
            class="invalid-feedback"
            *ngIf="passwordControl?.touched && passwordControl?.invalid"
          >
            Enter your password.
          </small>
        </div>

        <div class="signin__row">
          <label class="signin__check">
            <input type="checkbox" formControlName="rememberMe" />
            Remember Me
          </label>
          <a class="signin__link" routerLink="/login">Forgot Password</a>
        </div>

        <button type="submit" class="signin__submit" [disabled]="isLoading">
          {{ isLoading ? 'Signing in...' : 'Login' }}
        </button>

        <button type="button" class="signin__back" (click)="back()">
          <app-icon name="chevron-left" [size]="15"></app-icon>
          Back
        </button>
      </form>

      <p class="signin__footer">Pro-Create &copy; {{ year }}</p>
    </div>
  </div>
</div>

<app-qr-scanner
  [open]="isScannerOpen"
  [errorMessage]="scanError"
  title="Scan your card"
  hint="Hold your Pro-Create card up to the camera."
  (scanned)="onScanned($event)"
  (closed)="closeScanner()"
></app-qr-scanner>
